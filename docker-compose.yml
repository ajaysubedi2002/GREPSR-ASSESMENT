services:
  db:
    image: postgres:16-alpine
    container_name: grepsr-db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    networks:
      - grepsr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: grepsr-redis
    ports:
      - "6380:6379"
    networks:
      - grepsr
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Docker/Dockerfile
    container_name: grepsr-migrate
    env_file: .env
    depends_on:
      db:
        condition: service_healthy    # ← waits until postgres is actually ready
      redis:
        condition: service_healthy
    command: ["python", "manage.py", "migrate"]
    volumes:
      - ./backend:/app
    networks:
      - grepsr

  backend:
    build:
      context: ./backend
      dockerfile: Docker/Dockerfile
    container_name: grepsr-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy    # ← same here
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  # ← waits for migrations to finish
    volumes:
      - ./backend:/app
    networks:
      - grepsr

  frontend:
    build:
      context: ./frontend
      dockerfile: Docker/Dockerfile
      target: dev
    container_name: grepsr-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - grepsr

volumes:
  pgdata:

networks:
  grepsr:
    driver: bridge